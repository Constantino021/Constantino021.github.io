<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | Costa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1, h2, h3 { color: #58a6ff; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-top: 30px; }
    a { color: #58a6ff; }
    code { background: #161b22; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    pre { background: #161b22; padding: 15px; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    img { max-width: 100%; border-radius: 8px; border: 1px solid #30363d; margin: 15px 0; }
    .back-link { display: inline-block; margin-bottom: 20px; }
    strong { color: #f0f6fc; }
  </style>
</head>
<body>
  <a class="back-link" href="/">&larr; voltar ao portfólio</a>
  {{ content }}
</body>
</html>
